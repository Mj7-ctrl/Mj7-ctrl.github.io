<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#07080c">
    <title>Founder — AI Business Copilot</title>
    <link rel="stylesheet" href="founder.css">
</head>
<body>
    <canvas id="bg"></canvas>

    <div class="app">
        <header class="top">
            <div class="brand">
                <div class="logo"></div>
                <div class="brand-text">
                    <div class="brand-name">FOUNDER</div>
                    <div class="brand-sub" id="brand-sub">AI business copilot</div>
                </div>
            </div>
            <button class="icon" id="settings-btn" aria-label="Indstillinger">⚙</button>
        </header>

        <main id="view" class="view"></main>

        <nav class="tabs">
            <button class="tab" data-tab="generate">
                <span class="tab-ico">✦</span><span class="tab-lbl">Generér</span>
            </button>
            <button class="tab" data-tab="validate">
                <span class="tab-ico">◎</span><span class="tab-lbl">Validér</span>
            </button>
            <button class="tab" data-tab="pitch">
                <span class="tab-ico">◈</span><span class="tab-lbl">Pitch</span>
            </button>
            <button class="tab" data-tab="archive">
                <span class="tab-ico">◨</span><span class="tab-lbl">Arkiv</span>
            </button>
        </nav>
    </div>

    <div class="modal hidden" id="settings-modal">
        <div class="modal-inner">
            <h2>Indstillinger</h2>
            <label>Dit navn
                <input type="text" id="name-input" placeholder="Dit navn">
            </label>
            <label>Anthropic API-nøgle <span class="hint">(påkrævet — driver AI'en)</span>
                <input type="password" id="api-key-input" placeholder="sk-ant-…">
            </label>
            <label>Model
                <select id="model-select">
                    <option value="claude-sonnet-4-6">Sonnet 4.6 — anbefalet balance</option>
                    <option value="claude-haiku-4-5-20251001">Haiku 4.5 — hurtig</option>
                    <option value="claude-opus-4-7">Opus 4.7 — dybest analyse</option>
                </select>
            </label>
            <label>Sprog
                <select id="lang-select">
                    <option value="da">Dansk</option>
                    <option value="en">English</option>
                </select>
            </label>
            <div class="help">
                <p>Alt gemmes lokalt i din browser. Din API-nøgle sendes kun til Anthropic.</p>
                <p>Hent en nøgle på <a href="https://console.anthropic.com/" target="_blank" rel="noopener">console.anthropic.com</a></p>
            </div>
            <div class="row">
                <button id="export-btn" class="ghost">Eksportér</button>
                <button id="reset-btn" class="danger">Nulstil alt</button>
            </div>
            <div class="row">
                <button id="settings-close">Luk</button>
                <button id="settings-save" class="primary">Gem</button>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script src="founder.js"></script>
</body>
</html>
