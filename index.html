<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J.A.R.V.I.S. — Personlig Assistent</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="stars"></div>

    <header class="topbar">
        <div class="brand">
            <span class="logo">J.A.R.V.I.S.</span>
            <span class="subtitle">Just A Rather Very Intelligent System</span>
        </div>
        <div class="status">
            <span id="clock">--:--:--</span>
            <span id="connection" class="online">ONLINE</span>
        </div>
    </header>

    <main class="stage">
        <section class="panel left">
            <h3>System</h3>
            <ul class="sys-list">
                <li>Bruger: <span id="user-name">Sir</span></li>
                <li>Sprog: <span id="lang-label">Dansk</span></li>
                <li>Dato: <span id="today">--</span></li>
                <li>Batteri: <span id="battery">--</span></li>
                <li>Netværk: <span id="network">--</span></li>
            </ul>
            <h3>Hurtig-kommandoer</h3>
            <div class="quick">
                <button data-cmd="hvad er klokken">Tid</button>
                <button data-cmd="hvilken dato er det">Dato</button>
                <button data-cmd="fortæl en vittighed">Vittighed</button>
                <button data-cmd="åbn youtube">YouTube</button>
                <button data-cmd="søg efter claude ai">Søg</button>
                <button data-cmd="lav en note køb mælk">Note</button>
                <button data-cmd="vis noter">Vis noter</button>
                <button data-cmd="timer 1 minut">Timer</button>
            </div>
        </section>

        <section class="core">
            <div class="orb" id="orb">
                <div class="ring r1"></div>
                <div class="ring r2"></div>
                <div class="ring r3"></div>
                <div class="pulse"></div>
                <div class="label" id="orb-label">KLAR</div>
            </div>
            <div class="hint" id="hint">Tryk på mikrofonen eller skriv en besked…</div>
        </section>

        <section class="panel right">
            <h3>Samtale</h3>
            <div class="chat" id="chat"></div>
            <form class="composer" id="composer">
                <button type="button" id="mic-btn" title="Tal">🎙</button>
                <input type="text" id="input" placeholder="Spørg Jarvis om noget…" autocomplete="off" />
                <button type="submit" id="send-btn" title="Send">➤</button>
            </form>
            <div class="settings">
                <label>
                    <input type="checkbox" id="voice-toggle" checked> Stemmesvar
                </label>
                <label>
                    Sprog:
                    <select id="lang-select">
                        <option value="da-DK">Dansk</option>
                        <option value="en-US">English</option>
                    </select>
                </label>
                <button type="button" id="clear-btn">Ryd chat</button>
            </div>
        </section>
    </main>

    <footer class="footbar">
        <span>Sig "Jarvis, hjælp" for at se alle kommandoer.</span>
    </footer>

    <script src="jarvis.js"></script>
</body>
</html>
