<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>JARVIS</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <canvas id="blob"></canvas>

    <div class="hud">
        <span class="dot" id="conn-dot"></span>
        <span id="conn-text">connected</span>
    </div>

    <div class="status" id="status">tap to begin</div>

    <div class="corner">
        <button id="lang-btn" title="Sprog">EN</button>
        <button id="mute-btn" title="Mute">on</button>
    </div>

    <div class="overlay" id="overlay">
        <div class="overlay-inner">
            <div class="title">JARVIS</div>
            <button class="start-btn" id="start-btn">tap to begin</button>
            <div class="note">Tillad mikrofon når din browser spørger.</div>
        </div>
    </div>

    <script src="jarvis.js"></script>
</body>
</html>
